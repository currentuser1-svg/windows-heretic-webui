# Open WebUI in Docker Desktop, talking to llama-server running natively on Windows.
# Values come from C:\llama\webui\.env (generated by install.ps1, ACL: you + SYSTEM + Administrators).
name: heretic-webui

services:
  open-webui:
    image: ${OPENWEBUI_IMAGE:-ghcr.io/open-webui/open-webui:main}
    container_name: open-webui
    restart: unless-stopped
    ports:
      # localhost only. Not reachable from LAN.
      - "127.0.0.1:${WEBUI_PORT:-3000}:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # llama-server on the Windows host (Docker Desktop proxies host.docker.internal to host localhost)
      OPENAI_API_BASE_URL: "http://host.docker.internal:${LLAMA_PORT:-8080}/v1"
      OPENAI_API_KEY: "${LLAMA_API_KEY:?run install.bat}"
      ENABLE_OLLAMA_API: "false"
      WEBUI_SECRET_KEY: "${WEBUI_SECRET_KEY:?run install.bat}"
      # privacy
      ANONYMIZED_TELEMETRY: "false"
      DO_NOT_TRACK: "true"
      SCARF_NO_ANALYTICS: "true"
      HF_HUB_DISABLE_TELEMETRY: "1"
      ENABLE_COMMUNITY_SHARING: "false"
      ENABLE_VERSION_UPDATE_CHECK: "false"
    volumes:
      - open-webui:/app/backend/data

volumes:
  open-webui:
